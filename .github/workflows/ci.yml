name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check API routes
        run: |
          node --input-type=module --check < pages/api/\[...task\].js
          node --input-type=module --check < pages/api/ping.js

      - name: Validate and test Firefox extension
        run: |
          npm run extension:validate
          npm run extension:test

      - name: Syntax check FFmpeg render worker
        run: python3 -m py_compile render-worker/playlistpilot_render_worker.py

      - name: Next.js production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
        run: npm run build

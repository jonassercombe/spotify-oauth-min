name: Check PlaylistPilot follower sync manually

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Spotify account bucket to check (0–59)"
        required: true
        default: "0"
        type: string

permissions: {}

concurrency:
  group: playlistpilot-manual-sync-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: "https://playlist-pilot.com"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CHECK_BUCKET: ${{ inputs.bucket }}
    steps:
      - name: Refresh one playlist in the selected account bucket
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          [[ "$CHECK_BUCKET" =~ ^([0-9]|[1-5][0-9])$ ]] || exit 1
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/followers/cron-refresh-all?bucket=${CHECK_BUCKET}&discover=0&max=1&concurrency=1"
